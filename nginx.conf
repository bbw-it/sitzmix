# SitzMix – statisches Hosting.
#
# Der Server liefert ausschliesslich das Programm aus. Es gibt keine API und keinen
# Datenspeicher: Klassen-, Lernenden- und Zimmerdaten liegen allein im Browser
# (IndexedDB/localStorage). Die Content-Security-Policy unten macht diese Zusage
# technisch durchsetzbar, statt sie nur zu versprechen.
#
# ACHTUNG (nginx-Eigenheit): `add_header` wird von einer äusseren Ebene nur dann
# geerbt, wenn die innere Ebene selbst KEIN `add_header` setzt. Die Sicherheits-
# Header müssen darum in jedem `location`-Block wiederholt werden, der eigene
# Header setzt — sonst verlieren genau diese Antworten ihren Schutz.

# Kompression: spart bei JS/CSS rund zwei Drittel der Übertragung.
# Bereits komprimierte Formate (PNG/WebP) sind bewusst nicht gelistet.
gzip              on;
gzip_vary         on;
gzip_comp_level   6;
gzip_min_length   1024;
gzip_types        text/plain text/css application/javascript application/json
                  image/svg+xml application/manifest+json;

server {
  listen 80;
  # Auch auf IPv6 lauschen: im Container löst `localhost` zuerst nach ::1 auf.
  # Ohne diese Zeile schlägt der HEALTHCHECK des Dockerfiles fehl und der
  # Container gilt dauerhaft als "unhealthy", obwohl er normal ausliefert.
  listen [::]:80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Nginx-Version nicht ausplaudern
  server_tokens off;

  # ── Sicherheits-Header (Standard für alle Antworten) ──────────────────
  #
  # connect-src 'self' blob:  → Netzwerkzugriffe nur auf die eigene Herkunft.
  #   Damit kann selbst kompromittierter oder eingeschleuster Code die
  #   Lernenden-Daten nicht an Dritte senden. `blob:` wird für den PNG-Export
  #   gebraucht (html-to-image liest das Grundriss-Bild über seine blob:-URL).
  # script-src 'self'         → keine Inline-Skripte; der Vite-Build erzeugt nur
  #   externe, gehashte Dateien, darum ist das ohne 'unsafe-inline' möglich.
  # style-src ... 'unsafe-inline' → nötig, weil die App Positionen und Farben der
  #   Sitzplätze über React-`style`-Attribute setzt.
  # img-src ... data: blob:   → data: für das Favicon, blob: für Grundriss-Bilder
  #   aus der IndexedDB und den PNG-Export.
  # frame-ancestors 'none'    → kein Einbetten in fremde Seiten (Clickjacking).
  set $csp "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' blob:; worker-src 'self' blob:; manifest-src 'self'";

  add_header Content-Security-Policy   $csp                      always;
  add_header X-Content-Type-Options    "nosniff"                 always;
  add_header X-Frame-Options           "DENY"                    always;
  add_header Referrer-Policy           "no-referrer"             always;
  add_header Cross-Origin-Opener-Policy   "same-origin"          always;
  add_header Cross-Origin-Resource-Policy "same-origin"          always;
  # Fullscreen bleibt erlaubt (Vollbild-Ansicht des Sitzplans), alles andere nicht.
  add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=(), interest-cohort=(), fullscreen=(self)" always;

  # HSTS gehört an den TLS-terminierenden Reverse-Proxy (z.B. sitzmix.ch), nicht
  # in diesen Container, der intern nur HTTP spricht. Dort setzen:
  #   add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

  # ── SPA: alle Routen auf index.html ───────────────────────────────────
  # index.html darf nicht dauerhaft gecacht werden, sonst zeigen Clients nach
  # einem Deploy weiterhin auf die alten (gehashten) Asset-Namen.
  location / {
    try_files $uri $uri/ /index.html;

    add_header Cache-Control "no-cache" always;

    add_header Content-Security-Policy   $csp                      always;
    add_header X-Content-Type-Options    "nosniff"                 always;
    add_header X-Frame-Options           "DENY"                    always;
    add_header Referrer-Policy           "no-referrer"             always;
    add_header Cross-Origin-Opener-Policy   "same-origin"          always;
    add_header Cross-Origin-Resource-Policy "same-origin"          always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=(), interest-cohort=(), fullscreen=(self)" always;
  }

  # ── Gebaute Assets (Hash im Dateinamen) langfristig cachen ────────────
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;

    add_header Content-Security-Policy   $csp                      always;
    add_header X-Content-Type-Options    "nosniff"                 always;
    add_header X-Frame-Options           "DENY"                    always;
    add_header Referrer-Policy           "no-referrer"             always;
    add_header Cross-Origin-Opener-Policy   "same-origin"          always;
    add_header Cross-Origin-Resource-Policy "same-origin"          always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=(), interest-cohort=(), fullscreen=(self)" always;
  }

  # ── Beispiel-Grundriss (unversionierter Name → moderat cachen) ────────
  location = /default-floorplan.webp {
    add_header Cache-Control "public, max-age=86400" always;

    add_header Content-Security-Policy   $csp                      always;
    add_header X-Content-Type-Options    "nosniff"                 always;
    add_header X-Frame-Options           "DENY"                    always;
    add_header Referrer-Policy           "no-referrer"             always;
    add_header Cross-Origin-Opener-Policy   "same-origin"          always;
    add_header Cross-Origin-Resource-Policy "same-origin"          always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=(), interest-cohort=(), fullscreen=(self)" always;
  }
}

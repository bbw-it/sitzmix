server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA: alle Routen auf index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Gebaute Assets (mit Hash im Namen) langfristig cachen
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
